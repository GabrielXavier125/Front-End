    <title>Reels - Instagram Clone</title>
    <link rel="stylesheet" href="instagram-reels.css">

<body>
    <div class="reels-container">
        <!-- Reel 1 -->
        <div class="reel">
            <div class="reel-video"></div>
            <div class="reel-info">

                    <div class="avatar"></div>
                    <div>
                        <p class="username">usuario_1</p>

                    </div>
                </div>
                <div class="reel-caption">
                    <p>Primeiro reel incrível! 🎬✨</p>
                </div>
                <div class="reel-actions">

                    <button>💬 342</button>

                    <button>⬇️</button>

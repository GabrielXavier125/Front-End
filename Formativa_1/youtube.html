<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - YouTube Clone</title>
    <link rel="stylesheet" href="youtube.css">
</head>
<body>
    <header>
        <div class="logo">YouTube</div>
        <div class="search">
            <input type="text" placeholder="Pesquisar">
            <button>🔍</button>
        </div>
        <div class="user">👤</div>
    </header>

    <div class="container">
        <main>
            <section class="video-grid">
                <!-- repetir cartões de vídeo -->
                <article class="video-card">
                    <div class="thumb"></div>
                    <h3>Título do vídeo</h3>
                    <p>Canal • 1M visualizações • 1 semana atrás</p>
                </article>
                <article class="video-card">
                    <div class="thumb"></div>
                    <h3>Outro vídeo bacana</h3>
                    <p>Canal 2 • 345K visualizações • 3 dias atrás</p>
                </article>
                <article class="video-card">
                    <div class="thumb"></div>
                    <h3>Mais um conteúdo</h3>
                    <p>Canal 3 • 89K visualizações • 1 dia atrás</p>
                </article>
                <!-- adicionar quantos quiser para testar a grade -->
            </section>
        </main>
        <aside class="sidebar">
            <nav>
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Em alta</a></li>
                    <li><a href="#">Inscrições</a></li>
                    <li><a href="#">Biblioteca</a></li>
                    <li><a href="#">Histórico</a></li>
                </ul>
            </nav>
        </aside>
    </div>

</body>
</html>
